name: test
on: [pull_request, workflow_dispatch]

jobs:
  build-and-test:
    # Pinned rather than ubuntu-latest. These tests run bin/mysql from the
    # nightly dev server, which is built on Ubuntu 26.04 and needs glibc 2.42.
    # ubuntu-latest is Ubuntu 24.04, which has glibc 2.39.
    #
    # Go back to ubuntu-latest once it can run the nightly server's mysql
    # client: either the server is built against a compatible glibc, or
    # ubuntu-latest moves to Ubuntu 26.04 or newer.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install OpenSSL and libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libcurl4-openssl-dev
      - uses: villagesql/extension-actions/cpp@main
        with:
          extension-name: vsql_oauth2
          github-token: ${{ secrets.GITHUB_TOKEN }}
